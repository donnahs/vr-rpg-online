<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR RPG Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    width: 100vw; height: 100vh;
  }
  #canvas-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 12px;
    z-index: 10;
  }
  #login-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    pointer-events: auto;
  }
  #login-overlay.hidden { display: none; }
  .login-box {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    max-width: 360px; width: 90%;
  }
  .login-box h1 {
    font-size: 1.5rem; margin-bottom: 8px; color: #00d4ff;
  }
  .login-box p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
  .login-box input {
    width: 100%; padding: 12px 16px;
    background: #0f0f1a; border: 1px solid #333;
    border-radius: 8px; color: #fff; font-size: 1rem;
    margin-bottom: 12px;
  }
  .login-box input:focus { outline: none; border-color: #00d4ff; }
  .login-box button {
    width: 100%; padding: 12px;
    background: #00d4ff; color: #0a0a0a;
    border: none; border-radius: 8px;
    font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .login-box button:hover { background: #33ddff; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .stats {
    background: rgba(0,0,0,0.6);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .stats .hp-bar {
    width: 120px; height: 6px;
    background: #333; border-radius: 3px;
    margin-top: 4px; overflow: hidden;
  }
  .stats .hp-fill {
    height: 100%; background: #2ecc71;
    border-radius: 3px; transition: width 0.2s;
  }
  .vr-btn {
    background: rgba(0,0,0,0.6);
    border: 1px solid #00d4ff;
    color: #00d4ff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    pointer-events: auto;
  }
  .vr-btn:hover { background: rgba(0,212,255,0.15); }
  .vr-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .bottom-bar {
    display: flex; gap: 8px;
    align-items: flex-end;
  }
  .action-btn {
    background: rgba(0,0,0,0.6);
    border: 1px solid #555;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    pointer-events: auto;
  }
  .action-btn:hover { border-color: #00d4ff; }
  .events {
    flex: 1;
    background: rgba(0,0,0,0.5);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    max-height: 120px;
    overflow: hidden;
    line-height: 1.6;
  }
  .events div { opacity: 0.8; }
  .crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 8px; height: 8px;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .controls-hint {
    position: absolute; bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    color: #aaa;
    pointer-events: none;
  }
  @media (max-width: 600px) {
    .stats { font-size: 0.75rem; }
    .action-btn { padding: 8px 12px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="login-overlay">
  <div class="login-box">
    <h1>VR RPG Online</h1>
    <p>Multiplayer dungeon crawler in your browser.<br>Works on desktop, mobile, and VR headsets.</p>
    <input type="text" id="name-input" placeholder="Your hero name" maxlength="18" value="Hero">
    <button id="join-btn">Enter Dungeon</button>
    <p style="margin-top:12px;font-size:0.75rem;color:#666;">
      WASD to move • Mouse to look • Click to attack • E to pickup
    </p>
  </div>
</div>

<div id="hud">
  <div class="top-bar">
    <div class="stats" id="player-stats" style="display:none;">
      <div><strong id="p-name">Hero</strong> <span id="p-level">Lv.1</span></div>
      <div>HP: <span id="p-hp">100</span>/<span id="p-maxhp">100</span></div>
      <div class="hp-bar"><div class="hp-fill" id="hp-bar" style="width:100%"></div></div>
      <div>Gold: <span id="p-gold">0</span> | XP: <span id="p-xp">0</span></div>
    </div>
    <button class="vr-btn" id="vr-btn" disabled>Enter VR</button>
  </div>
  <div class="crosshair"></div>
  <div class="controls-hint">WASD = move | Mouse = look | Click = attack | E = pickup</div>
  <div class="bottom-bar">
    <div class="events" id="events-log"><div>Welcome to VR RPG Online...</div></div>
    <button class="action-btn" id="attack-btn">Attack</button>
    <button class="action-btn" id="pickup-btn">Pickup (E)</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
